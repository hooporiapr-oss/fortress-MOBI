<style>
[hidden]{display:none!important}#mp{max-width:760px;margin:0 auto 18px;border:1px solid #554b24;border-radius:16px;padding:16px;background:#13141e}#mp h1{color:#FFD700;font-size:1.5rem}#mp h2{font-size:1rem;margin:18px 0 8px}#mp p{font-size:.82rem;color:#c5c7d1;line-height:1.5;margin:8px 0}#mp .mp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}#mp .mp-cell{background:#202130;border-radius:10px;padding:12px}#mp .mp-cell b{display:block;color:#FFD700;font-size:1.6rem}#mp .mp-cell span{font-size:.78rem;color:#c5c7d1}#mp .mp-scroll{overflow:auto}#mp table{width:100%;border-collapse:collapse;font-size:.8rem;font-variant-numeric:tabular-nums}#mp th,#mp td{padding:8px 4px;border-bottom:1px solid #383849;text-align:left}#mp button{min-height:44px;border:1px solid #FFD700;background:transparent;color:#FFD700;border-radius:9px;padding:8px 12px;margin:10px 5px 0 0;font-weight:bold;cursor:pointer}#mp label{font-size:.8rem;display:block;margin-top:12px}#mp .mp-ach{background:#202130;border-radius:9px;padding:10px;margin:8px 0;color:#FFD700}#mpPrintRoot{display:none}@media print{#mp{display:none!important}body.mp-print>*{display:none!important}body.mp-print #mpPrintRoot{display:block!important;color:#111;background:#fff;width:100%;font:10pt Arial,sans-serif}#mpPrintRoot h1,#mpPrintRoot h2{margin:12pt 0 6pt}#mpPrintRoot p{margin:6pt 0;line-height:1.4}#mpPrintRoot table{width:100%;border-collapse:collapse}#mpPrintRoot th,#mpPrintRoot td{padding:5pt;text-align:left;border-bottom:1px solid #ccc}#mpPrintRoot tr{break-inside:avoid}#mpPrintRoot .mp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8pt}#mpPrintRoot .mp-cell{border:1px solid #ccc;padding:8pt}#mpPrintRoot .mp-cell b,#mpPrintRoot .mp-cell span{display:block}#mpPrintRoot .mp-ach{margin:6pt 0}}
</style></head>
