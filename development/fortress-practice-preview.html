<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fortress · Personalized practice preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101c2a;color:#fff;font:16px system-ui,sans-serif}main{max-width:440px;margin:auto;padding:18px}header,.stats,.actions{display:flex;gap:10px;align-items:center;justify-content:space-between}h1{text-align:center;margin:20px 0 4px;font-size:32px}p{text-align:center}button{font:inherit;cursor:pointer;border:1px solid #65798b;border-radius:10px;padding:12px;background:#203345;color:#fff}button:disabled{cursor:default;opacity:.65}.tempo{color:#ff9b43;text-align:center;font-size:32px;font-weight:800}.stats>div{flex:1;min-width:0;background:#203345;padding:12px 4px;text-align:center;border-radius:10px}.stats strong{display:block;font-size:24px}.stats span{font-size:11px;color:#c0cbd5}.court{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:16px 0;background:#172b3e;padding:9px;border-radius:12px}.cell{aspect-ratio:1;padding:0;min-width:0;background:#294155}.cell:disabled{opacity:1}.cell{font-weight:700;font-size:clamp(16px,5vw,24px)}#best{color:#ff9b43}.cell.lit{background:#ff7a18;border-color:#ffe0b7}.actions button{flex:1}.primary{background:#ff7a18;color:#101c2a;font-weight:800;border-color:#ff7a18}.note{font-size:12px;color:#b8c8d7;line-height:1.5}button:focus-visible{outline:3px solid white;outline-offset:2px}
.court{position:relative;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);aspect-ratio:1.05;gap:10px;align-items:center;justify-items:center;background:linear-gradient(90deg,transparent 49.7%,#ffffff30 49.7%,#ffffff30 50.3%,transparent 50.3%),#172b3e;border:2px solid #ffffff40}.cell{width:88%;aspect-ratio:1;border-radius:50%;background:var(--ball);color:#101c2a;border:3px solid #101c2a;opacity:.6;box-shadow:inset 0 0 0 2px #ffffff45;position:relative;isolation:isolate}.cell::before,.cell::after{content:'';position:absolute;background:#101c2a55;z-index:-1}.cell::before{width:100%;height:2px;left:0;top:50%}.cell::after{width:2px;height:100%;left:50%;top:0}.cell:disabled{opacity:.55}.cell.lit{opacity:1;background:var(--ball);outline:3px solid white;box-shadow:0 0 16px var(--ball)}.cell:nth-child(1){grid-area:2/2;--ball:#f97316}.cell:nth-child(2){grid-area:1/1;--ball:#ef4444}.cell:nth-child(3){grid-area:1/3;--ball:#60a5fa}.cell:nth-child(4){grid-area:3/1;--ball:#4ade80}.cell:nth-child(5){grid-area:3/3;--ball:#c084fc}</style></head><body><main>
<header><strong>COGNITIVO GYM</strong><button id="language" type="button">EN</button></header>
<h1>FORTRESS</h1><p id="subtitle"></p><div class="tempo" id="tempo">— BPM</div>
<div class="stats"><div><span id="levelLabel"></span><strong id="level">1</strong></div><div><span id="roundLabel"></span><strong id="rounds">0</strong></div><div><span id="correctLabel"></span><strong id="correct">0</strong></div><div><span id="bestLabel"></span><strong id="best">0</strong></div></div>
<div class="court" id="court" role="group"></div><p id="status" role="status" aria-live="polite"></p>
<div class="actions"><button id="start" class="primary" type="button" disabled></button><button id="stop" type="button"></button></div><p class="note" id="note"></p>
</main><script src="./fortress-practice-engine.cjs"></script><script src="./fortress-bpm-adapter.cjs"></script><script src="./fortress-practice-preview.cjs"></script></body></html>
