<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Centro de Registro del Atleta — Demo</title><style>
*{box-sizing:border-box}body{margin:0;background:#13141e;color:#fff;font:16px system-ui,sans-serif}main{max-width:660px;margin:auto;padding:20px}h1,h2{color:#ffd700}p{line-height:1.55;color:#d1d3dc}section{border:1px solid #554b24;border-radius:12px;padding:16px;margin:16px 0;background:#202130}label{display:block;margin:12px 0;line-height:1.5}button,select{font:inherit;min-height:44px;border:1px solid #ffd700;border-radius:8px;background:#13141e;color:#ffd700;padding:9px 14px}button:disabled{opacity:.4}button{cursor:pointer}input[type=checkbox]{width:20px;height:20px;vertical-align:middle}select{width:100%}header{display:flex;justify-content:space-between;align-items:center;gap:12px}.notice{border:1px solid #ffd700;padding:12px;border-radius:8px;color:#ffd700}#result{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#c5c7d1}</style></head>
<body><main><header><small>HOOPORIA · DEVELOPMENT</small><button id="lang" type="button">EN</button></header><h1 id="title"></h1><p class="notice" id="notice"></p><section><h2 id="step1"></h2><label><input type="checkbox" id="identity"> <span id="idLabel"></span></label><label><input type="checkbox" id="authority"> <span id="authorityLabel"></span></label><label><input type="checkbox" id="distinct"> <span id="distinctLabel"></span></label></section><section><h2 id="step2"></h2><label for="program" id="programLabel"></label><select id="program"><option value="">—</option><option value="demo-a">Demo A</option><option value="demo-b">Demo B</option></select><label><input type="checkbox" id="membership"> <span id="membershipLabel"></span></label></section><section><h2 id="step3"></h2><label><input type="checkbox" id="coach"> <span id="coachLabel"></span></label><label><input type="checkbox" id="scope"> <span id="scopeLabel"></span></label></section><section><h2 id="step4"></h2><label><input type="checkbox" id="links"> <span id="linksLabel"></span></label><p id="linkNote"></p></section><button id="preview" type="button" disabled></button> <button id="reset" type="button"></button><section id="summary" hidden><h2 id="summaryTitle"></h2><p id="result" role="status"></p></section><p id="footer"></p></main><script>
'use strict';
const T={es:{title:'Centro de Registro del Atleta',notice:'PROTOTIPO LOCAL · Solo datos ficticios. No registra atletas reales ni guarda datos.',step1:'1. Verificación de identidad',idLabel:'Identidad ficticia verificada por operador autorizado',authorityLabel:'Autoridad del tutor o del atleta verificada según corresponda',distinctLabel:'Confirmado: no se utiliza el nombre como identificador',step2:'2. Membresía del programa',programLabel:'Programa ficticio',membershipLabel:'Membresía confirmada',step3:'3. Autorización del entrenador',coachLabel:'Cuenta individual del entrenador verificada',scopeLabel:'Acceso limitado a la membresía específica y revocable',step4:'4. Historial existente',linksLabel:'Confirmo que los registros sin verificar permanecerán sin vincular',linkNote:'La vinculación histórica requiere evidencia independiente y revisión del operador. Este prototipo no vincula registros.',preview:'Simular registro',reset:'Reiniciar',summaryTitle:'Resultado de simulación',footer:'No se utiliza almacenamiento local ni conexión a bases de datos. Las confirmaciones son simuladas y no constituyen verificación real.',result:'Flujo simulado completo. No se creó identidad, membresía, autorización ni vínculo real.'},en:{title:'Athlete Enrollment Center',notice:'LOCAL PROTOTYPE · Synthetic data only. Does not enroll real athletes or save data.',step1:'1. Identity verification',idLabel:'Synthetic identity verified by authorized operator',authorityLabel:'Guardian or athlete authority verified as applicable',distinctLabel:'Confirmed: name is not used as an identifier',step2:'2. Program membership',programLabel:'Synthetic program',membershipLabel:'Membership confirmed',step3:'3. Coach authorization',coachLabel:'Individual coach account verified',scopeLabel:'Access limited to specific membership and revocable',step4:'4. Existing history',linksLabel:'Confirm that unverified records remain unlinked',linkNote:'Historical linking requires independent evidence and operator review. This prototype does not link records.',preview:'Simulate enrollment',reset:'Reset',summaryTitle:'Simulation result',footer:'No local storage or database connection. Confirmations are simulated and do not constitute real verification.',result:'Simulated workflow complete. No real identity, membership, authorization or link was created.'}};
function enrollmentReady(state){return ['identity','authority','distinct','membership','coach','scope','links'].every(k=>state[k]===true)&&['demo-a','demo-b'].includes(state.program)}
const $=id=>document.getElementById(id),checks=['identity','authority','distinct','membership','coach','scope','links'];let lang='es';
function state(){return Object.fromEntries([...checks.map(k=>[k,$(k).checked]),['program',$('program').value]])}
function invalidate(){$('preview').disabled=!enrollmentReady(state());$('summary').hidden=true;$('result').textContent=''}
function render(){document.documentElement.lang=lang;Object.entries(T[lang]).forEach(([k,v])=>{if(k!=='result'&&$(k))$(k).textContent=v});$('lang').textContent=lang==='es'?'EN':'ES';document.title=T[lang].title;invalidate()}
checks.forEach(k=>$(k).addEventListener('change',invalidate));$('program').addEventListener('change',invalidate);
$('preview').onclick=()=>{if(!enrollmentReady(state()))return;$('summary').hidden=false;$('result').textContent=T[lang].result};
$('reset').onclick=()=>{checks.forEach(k=>$(k).checked=false);$('program').value='';invalidate()};
$('lang').onclick=()=>{lang=lang==='es'?'en':'es';render()};render();
</script></body></html>
