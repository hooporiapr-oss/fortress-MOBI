<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Replay · Personalized practice preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101c2a;color:#fff;font:16px system-ui,sans-serif}main{max-width:440px;margin:auto;padding:18px}header,.stats,.actions{display:flex;gap:10px;align-items:center;justify-content:space-between}h1{text-align:center;margin:20px 0 4px;font-size:32px}p{text-align:center}button{font:inherit;cursor:pointer;border:1px solid #65798b;border-radius:10px;padding:12px;background:#203345;color:#fff}button:disabled{cursor:default;opacity:.65}.tempo{color:#ff9b43;text-align:center;font-size:32px;font-weight:800}.stats>div{flex:1;min-width:0;background:#203345;padding:12px 4px;text-align:center;border-radius:10px}.stats strong{display:block;font-size:24px}.stats span{font-size:11px;color:#c0cbd5}.court{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:16px 0;background:#172b3e;padding:9px;border-radius:12px}.cell{aspect-ratio:1;padding:0;min-width:0;background:#294155}.cell:disabled{opacity:1}.cell{font-weight:700;font-size:clamp(16px,5vw,24px)}#best{color:#ff9b43}.cell.lit{background:#ff7a18;border-color:#ffe0b7}.actions button{flex:1}.primary{background:#ff7a18;color:#101c2a;font-weight:800;border-color:#ff7a18}.note{font-size:12px;color:#b8c8d7;line-height:1.5}button:focus-visible{outline:3px solid white;outline-offset:2px}
</style></head><body><main>
<header><strong>COGNITIVO GYM</strong><button id="language" type="button">EN</button></header>
<h1>REPLAY</h1><p id="subtitle"></p><div class="tempo" id="tempo">— BPM</div>
<div class="stats"><div><span id="levelLabel"></span><strong id="level">2</strong></div><div><span id="roundLabel"></span><strong id="rounds">0</strong></div><div><span id="correctLabel"></span><strong id="correct">0</strong></div><div><span id="bestLabel"></span><strong id="best">0</strong></div></div>
<div class="court" id="court" role="group"></div><p id="status" role="status" aria-live="polite"></p>
<div class="actions"><button id="start" class="primary" type="button" disabled></button><button id="stop" type="button"></button></div><p class="note" id="note"></p>
</main><script src="./replay-practice-engine.cjs"></script><script src="./replay-bpm-adapter.cjs"></script><script src="./replay-practice-preview.cjs"></script></body></html>
