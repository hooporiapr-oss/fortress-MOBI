<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Coach View | Cognitivo Gym</title>
<!-- Coach View for hooporia.mobi — for coaches only, the same as on vreaction.com.
     Opens with a Coach code (License Admin → Coach tab); a game code never opens it,
     so no kid sees a ranking.
     Every player of the coach's school who filled in his info after signing in
     (name, age, grade — jugador-hm.js), A–Z (never ranked): his best score in each
     of the four stations and the last day played. Tap a player for each station's
     first, latest and best score, and a progress chart.
     The players' info is private: it is read only through hooporia_coach() with a
     Coach code for that school (hooporia-players.sql).
     The code is kept in memory only: reload, Lock or ← THE GYM closes the view. -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none !important}
html,body{background:#0a0a0f;color:#fff;font-family:Arial,sans-serif}
body{min-height:100vh;padding:20px 16px 40px;display:flex;flex-direction:column;align-items:center}
.top{width:100%;max-width:720px;display:flex;justify-content:space-between;gap:8px;margin-bottom:18px}
.pill{padding:8px 16px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.5);color:#fff;font:900 .78rem Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;text-decoration:none;cursor:pointer}
.t{font-size:2rem;font-weight:900;font-style:italic;letter-spacing:.06em;text-transform:uppercase;text-align:center;text-shadow:0 0 30px rgba(255,215,0,.45)}
.t span{color:#FFD700}
.sub{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:#a7adba;margin:6px 0 16px;text-align:center}
#gate{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;align-items:stretch;margin-top:20px}
#code{padding:14px;border-radius:12px;border:2px solid rgba(255,215,0,.45);background:rgba(255,215,0,.06);color:#fff;font:900 1.1rem Arial,sans-serif;text-align:center;letter-spacing:.12em;text-transform:uppercase}
#open{padding:14px;border-radius:12px;border:0;background:linear-gradient(135deg,#FFD700,#FF6B35);color:#1a0f0f;font:900 1rem Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
#err{min-height:1.2em;text-align:center;font-size:.85rem;color:#a7adba}
.note{font-size:.72rem;color:#7d8696;text-align:center;line-height:1.4}
#view{width:100%;max-width:720px}
.gtitle{font-size:.72rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#a855f7;text-align:center;margin-bottom:10px}
.head,.row{display:grid;grid-template-columns:minmax(0,1.7fr) repeat(4,minmax(0,1fr)) 54px;gap:6px;align-items:center}
.row .nm{white-space:normal;overflow-wrap:anywhere;line-height:1.15}
.nm small{display:block;font-size:.68rem;font-weight:700;color:#FFD700;letter-spacing:.02em;margin-top:2px}
.head{font-size:.6rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#7d8696;padding:0 12px 6px}
.head span:not(:first-child),.row span:not(:first-child){text-align:center}
.row{padding:12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);margin-bottom:7px;cursor:pointer;width:100%;color:#fff;font:inherit;text-align:left}
.row:active{background:rgba(255,215,0,.1)}
.nm{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v{font-weight:900;font-size:.95rem}
.v small{display:block;font-size:.58rem;color:#7d8696;font-weight:700;letter-spacing:.04em}
.up{color:#3ddc84}.dn{color:#ff6b6b}.eq{color:#a7adba}
.last{font-size:.72rem;color:#a7adba}
.empty{color:#a7adba;text-align:center;padding:24px}
.count{font-size:.7rem;color:#7d8696;text-align:center;margin-top:10px;line-height:1.5}
#player{width:100%;max-width:640px}
.pname{font-size:1.5rem;font-weight:900;text-align:center;margin-bottom:4px}
.pcat{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:#a7adba;text-align:center;margin-bottom:16px}
.game{border-radius:14px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);padding:14px;margin-bottom:12px}
.gname{font-size:.72rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px;color:#a855f7}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.cell{text-align:center;padding:8px 4px;border-radius:10px;background:rgba(255,255,255,.04)}
.cell b{display:block;font-size:1.4rem}
.cell i{font-style:normal;font-size:.58rem;color:#a7adba;letter-spacing:.08em;text-transform:uppercase}
.chg{font-size:.78rem;color:#c8ccd4;text-align:center;margin-bottom:6px}
svg.chart{width:100%;height:auto;display:block}
@media(max-width:520px){
  .head,.row{grid-template-columns:minmax(0,1.5fr) repeat(4,minmax(0,1fr))}
  .head span:last-child,.row .last{display:none}
  .v{font-size:.85rem}
}
</style>
</head>
<body>
<div class="top">
  <a class="pill" href="index.html">← THE GYM</a>
  <button class="pill" id="lockBtn" type="button" hidden>🔒 Lock</button>
</div>
<div class="t">COACH <span>VIEW</span></div>
<div class="sub" id="sub">Coaches only</div>

<div id="gate">
  <input id="code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Coach code">
  <button id="open" type="button">Open</button>
  <div id="err"></div>
  <div class="note">A Coach code is made in License Admin → Coach. A game code does not open this view.</div>
</div>

<div id="view" hidden>
  <div class="gtitle">🏀 Players · best score in each station</div>
  <div class="head"><span>Player · A–Z</span><span>Recall</span><span>Recog.</span><span>Replay</span><span>Fortress</span><span>Last</span></div>
  <div id="list"></div>
  <div class="count" id="count"></div>
</div>

<div id="player" hidden>
  <div class="top" style="max-width:none"><button class="pill" id="backList" type="button">← All players</button></div>
  <div class="pname" id="pname"></div>
  <div class="pcat" id="pcat"></div>
  <div id="pbody"></div>
</div>

<script>
var SB_URL='https://sdaphocueugzfvjovuxd.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkYXBob2N1ZXVnemZ2am92dXhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MjQyMDgsImV4cCI6MjA5OTIwMDIwOH0.pDAzf4P6dD9eNEBlnP95SdF5BI-R84-Rdc0vKzYcn7M';
var H={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};
function $(id){return document.getElementById(id)}
function esc(x){return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

// ── The coach code: held in memory only ──
var school='', players={};
function deviceId(){var id=null;try{id=localStorage.getItem('gostar-device-id')}catch(e){}
  if(!id){id='d-'+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);try{localStorage.setItem('gostar-device-id',id)}catch(e){}}return id}
function rpc(name,body){return fetch(SB_URL+'/rest/v1/rpc/'+name,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify(body)})}
var checking=false;
var GAMES=[['recall','🧠 The Recall'],['recognition','👁 The Recognition'],['replay','🔁 The Replay'],['fortress','🏰 The Fortress']];
function gradeLabel(g){if(!g)return '';if(g==='K')return 'Kinder';if(g==='College')return 'College';var n=+g;if(!n)return String(g);return n+(n===1?'st':n===2?'nd':n===3?'rd':'th')+' grade'}
function info(p){return (p.age?p.age+' yrs':'')+(p.age&&p.grade?' · ':'')+gradeLabel(p.grade)}
function infoShort(p){return info(p).replace(' grade','')}
function openView(){
  if(checking)return;
  var code=$('code').value.trim(); if(!code)return;
  checking=true; $('err').style.color=''; $('err').textContent='Checking…';
  rpc('hooporia_coach',{p_code:code})
    .then(function(r){if(!r.ok)throw 0;return r.json()})
    .then(function(d){
      checking=false;
      if(!d||!d.school&&d.school!==''){
        $('err').style.color='#ff8888';$('err').textContent='Not a Coach code — or it is no longer active.';$('code').value='';return;
      }
      school=d.school||'';
      $('code').value=''; $('err').textContent='';
      $('gate').hidden=true; $('view').hidden=false; $('lockBtn').hidden=false;
      $('sub').textContent='Coaches only'+(school?' · '+school:'');
      build(d); render();
    })
    .catch(function(){checking=false;$('err').style.color='#ff8888';$('err').textContent='Connection problem — please try again.'});
}
$('open').onclick=openView;
$('code').addEventListener('keydown',function(e){if(e.key==='Enter')openView()});
$('lockBtn').onclick=function(){school='';players={};
  $('view').hidden=true;$('player').hidden=true;$('gate').hidden=false;$('lockBtn').hidden=true;
  $('sub').textContent='Coaches only';$('list').innerHTML='';$('count').textContent=''};

// ── The players: their info (the newest one they gave) and their scores per station ──
function build(d){
  players={};
  function who(r){var k=String(r.name||'').trim().toLowerCase(); if(!k)return null;
    var p=players[k]||(players[k]={name:String(r.name).trim(),age:null,grade:'',games:{},last:''});
    if(!p.at||r.at>=p.at){p.at=r.at; if(r.age)p.age=r.age; if(r.grade)p.grade=r.grade; p.name=String(r.name).trim()}
    if(r.at&&r.at>p.last)p.last=r.at; return p}
  (d.players||[]).forEach(who);
  (d.runs||[]).forEach(function(r){var p=who(r); if(!p)return; (p.games[r.game]||(p.games[r.game]=[])).push({v:+r.score||0,at:r.at})});
}
function best(a){var t=0;(a||[]).forEach(function(x){if(x.v>t)t=x.v});return t}
function day(at){if(!at)return '—';var d=new Date(at);return isNaN(d)?'—':(d.getMonth()+1)+'/'+d.getDate()}
function render(){
  var keys=Object.keys(players).sort(function(a,b){return players[a].name.localeCompare(players[b].name,undefined,{sensitivity:'base'})});
  $('list').innerHTML=keys.length?keys.map(function(k){var p=players[k];
    return '<button class="row" type="button" data-k="'+esc(k)+'"><span class="nm">'+esc(p.name)+'<small>'+esc(infoShort(p))+'</small></span>'+
      GAMES.map(function(g){var a=p.games[g[0]];return '<span class="v">'+(a&&a.length?best(a):'—')+'</span>'}).join('')+
      '<span class="last">'+day(p.last)+'</span></button>';
  }).join(''):'<div class="empty">No players yet'+(school?' at '+esc(school):'')+'.<br>Players show up here once they sign in and fill in their name, age and grade.</div>';
  $('count').innerHTML=keys.length?keys.length+' player'+(keys.length>1?'s':'')+' · listed A–Z, not ranked · best score in each station':'';
  $('list').querySelectorAll('.row').forEach(function(b){b.onclick=function(){showPlayer(b.dataset.k)}});
}

// ── One player: each station over time ──
function chart(pts){
  if(pts.length<2)return '';
  var vals=pts.map(function(p){return p.v}),mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),topI=vals.indexOf(mx);
  var lo=Math.max(0,mn-Math.max(1,Math.round((mx-mn)*.15))),hi=Math.max(mx+Math.max(1,Math.round((mx-mn)*.15)),lo+4);
  var W=560,Hh=200,L=48,R=16,T=18,B=30;
  var X=function(i){return L+(W-L-R)*i/(pts.length-1)},Y=function(v){return T+(Hh-T-B)*(hi-v)/(hi-lo)};
  var g=Math.max(1,Math.ceil((hi-lo)/4));
  var s='<svg class="chart" viewBox="0 0 '+W+' '+Hh+'">';
  for(var y=lo;y<=hi;y+=g)s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(y)+'" y2="'+Y(y)+'" stroke="rgba(255,255,255,.08)"/><text x="'+(L-8)+'" y="'+(Y(y)+4)+'" fill="#9fb3c8" font-size="12" text-anchor="end">'+y+'</text>';
  s+='<polyline fill="none" stroke="#a855f7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="'+pts.map(function(p,i){return X(i).toFixed(1)+','+Y(p.v).toFixed(1)}).join(' ')+'"/>';
  pts.forEach(function(p,i){var t=i===topI;s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(t?7:4.5)+'" fill="'+(t?'#FFD700':'#a855f7')+'" stroke="#000" stroke-width="1.5"><title>'+p.v+' · '+day(p.at)+'</title></circle>'});
  s+='<text x="'+L+'" y="'+(Hh-8)+'" fill="#9fb3c8" font-size="12">'+day(pts[0].at)+'</text><text x="'+(W-R)+'" y="'+(Hh-8)+'" fill="#9fb3c8" font-size="12" text-anchor="end">'+day(pts[pts.length-1].at)+'</text>';
  return s+'</svg>';
}
function showPlayer(k){
  var p=players[k]; if(!p)return;
  $('view').hidden=true; $('player').hidden=false; window.scrollTo(0,0);
  $('pname').textContent=p.name;
  $('pcat').textContent=[info(p),school,'last played '+day(p.last)].filter(Boolean).join(' · ');
  $('pbody').innerHTML=GAMES.map(function(g){
    var a=p.games[g[0]]||[];
    if(!a.length)return '<div class="game"><div class="gname">'+g[1]+'</div><div class="chg">Not played yet</div></div>';
    var pts=a.slice(-40),first=a[0].v,last=a[a.length-1].v,b=best(a),d=last-first;
    return '<div class="game"><div class="gname">'+g[1]+' · score</div>'+
      '<div class="stats"><div class="cell"><b>'+first+'</b><i>First</i></div><div class="cell"><b>'+last+'</b><i>Latest</i></div><div class="cell"><b>'+b+'</b><i>Best</i></div></div>'+
      '<div class="chg">'+(a.length<2?'One run so far':'<b>'+(d>0?'+':'')+d+'</b> since the first run · '+a.length+' runs')+'</div>'+chart(pts)+'</div>';
  }).join('');
}
$('backList').onclick=function(){$('player').hidden=true;$('view').hidden=false};
</script>
</body>
</html>
