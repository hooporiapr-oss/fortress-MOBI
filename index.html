<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>The Fortress Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#FFD700;--orange:#FF6B35;--dark:#0a0a0f;--text:#fff;--muted:#8892a0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Outfit',sans-serif;background:var(--dark);color:var(--text);touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overflow:hidden}

#strobe{position:fixed;inset:0;z-index:1;pointer-events:none;background:var(--gold);opacity:0;transition:opacity .07s ease-out}
#dots{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.beat-dot{position:absolute;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffe066,var(--gold));box-shadow:0 0 28px rgba(255,215,0,.9);opacity:0}
@keyframes beatDotFly{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-50%) scale(.5)}}

#center{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.site-title{font-family:'Bebas Neue',sans-serif;font-size:2.4rem;letter-spacing:5px;background:linear-gradient(135deg,var(--gold),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
.site-sub{font-size:.7rem;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-bottom:34px}

/* One button where the code panel was. Same width as the panel it
   replaces, so the page keeps its proportions. */
.enter-btn{width:100%;max-width:340px;padding:18px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--orange));color:#1a0f0f;font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;box-shadow:0 4px 24px rgba(255,107,53,.35)}
.enter-btn:active{transform:scale(.98)}
.enter-note{font-size:.68rem;color:var(--muted);margin-top:14px;line-height:1.4;max-width:300px}

.brandmark{margin-top:40px;font-size:.68rem;font-weight:900;letter-spacing:.3em;text-transform:uppercase;color:#4a5058}
.brandmark b{color:var(--muted);font-style:italic}
</style>
</head>
<body>

<div id="strobe"></div>
<div id="dots"></div>

<div id="center">
  <div class="site-title">THE FORTRESS MOBILE</div>
  <div class="site-sub">Memory Basketball</div>

  <button class="enter-btn" id="enterBtn" onclick="enter()">Start Training →</button>
  <div class="enter-note">No code needed — tap to start.</div>

  <div class="brandmark">Powered by <b>Gostar Digital</b></div>
</div>

<script>
var $=function(id){return document.getElementById(id)};

// ══════════════════════════════════════════════════════
//  OPEN ENTRY — the access code is gone.
//
//  This page used to ask for a license code and check it against
//  Supabase (check_license, product 'fortress-mobile') before letting
//  anyone through. That whole layer is removed: no code, no lookup,
//  no license key kept on the device. Anyone with the link plays.
//
//  ONE THING FROM THE OLD GATE HAS TO STAY, and it is not optional.
//  Every game file in this product starts with:
//
//      if (localStorage.getItem('rct-mobile-pass') !== '1')
//          window.location.replace('index.html');
//
//  So a game that finds no pass key sends the player straight back
//  here. Drop the key as well as the code and the two pages bounce
//  the player between each other forever — the gate would be gone and
//  the product would be unreachable, which is the opposite of opening
//  it up. Setting it here keeps every game file working untouched.
//
//  It is set on the way through rather than on page load, so the
//  landing screen is a real screen somebody arrives at, not a flash
//  of gold before a redirect.
//
//  WHAT WENT WITH THE CODE: the school name. It used to come back
//  from check_license and travel with the device, and the standings
//  read it from there. With no license there is nobody to ask, so
//  runs recorded from this device carry no school. If the standings
//  need to tell schools apart again, that name has to come from
//  somewhere else — asking the player once, or a per-school link.
// ══════════════════════════════════════════════════════
function enter(){
  try {
    localStorage.setItem('rct-mobile-pass','1');
    /* Anything a previous licensed install left behind is cleared, so
       a device that used to be licensed does not keep claiming a
       school it can no longer prove. */
    localStorage.removeItem('rct-mobile-license');
    localStorage.removeItem('rct-mobile-school');
  } catch(e){}
  window.location.href = 'fortress-mobile-hub.html';
}

// ── 120 beat: visual (strobe + flying gold dots), matching the hub's own ambient effect ──
var BPM = 120, beatMs = 60000/BPM;
function beatTick(){
  var st=$('strobe'); if(st){st.style.opacity='.10'; setTimeout(function(){st.style.opacity='0'},80)}
  spawnDot();
}
function spawnDot(){
  var layer=$('dots'); if(!layer) return;
  var d=document.createElement('div');
  d.className='beat-dot';
  d.style.left=(8+Math.random()*84)+'%';
  d.style.top=(8+Math.random()*74)+'%';
  var dur=Math.round(beatMs*0.95);
  d.style.animation='beatDotFly '+dur+'ms ease-out forwards';
  layer.appendChild(d);
  setTimeout(function(){ if(d&&d.parentNode) d.parentNode.removeChild(d) }, dur+60);
}
setInterval(beatTick, beatMs);
beatTick();
</script>
</body>
</html>
