<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Cognitivo Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#FFD700;--orange:#FF6B35;--dark:#0a0a0f;--text:#fff;--muted:#8892a0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Outfit',sans-serif;background:var(--dark);color:var(--text);touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overflow:hidden}

#strobe{position:fixed;inset:0;z-index:1;pointer-events:none;background:var(--gold);opacity:0;transition:opacity .07s ease-out}
#dots{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.beat-dot{position:absolute;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffe066,var(--gold));box-shadow:0 0 28px rgba(255,215,0,.9);opacity:0}
@keyframes beatDotFly{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-50%) scale(.5)}}

#center{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.site-title{font-family:'Bebas Neue',sans-serif;font-size:2.4rem;letter-spacing:5px;background:linear-gradient(135deg,var(--gold),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
.site-sub{font-size:.7rem;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-bottom:34px}

.code-label{font-size:.68rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.code-input{width:100%;max-width:340px;padding:16px;border-radius:10px;border:2px solid rgba(255,215,0,.35);background:rgba(255,255,255,.05);color:#fff;font-family:'Courier New',monospace;font-size:1.4rem;font-weight:900;letter-spacing:.25em;text-transform:uppercase;text-align:center;-webkit-user-select:text;user-select:text}
.code-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 24px rgba(255,215,0,.3)}
.code-input.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.enter-btn{width:100%;max-width:340px;margin-top:14px;padding:18px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--orange));color:#1a0f0f;font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;box-shadow:0 4px 24px rgba(255,107,53,.35)}
.enter-btn:active{transform:scale(.98)}
.err{margin-top:14px;color:#ff8888;font-size:.85rem;font-weight:700;min-height:18px;max-width:320px}

.coach-link{display:inline-block;margin-top:10px;padding:7px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.18);color:#9aa3b2;font-size:.66rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
.brandmark{margin-top:40px;font-size:.68rem;font-weight:900;letter-spacing:.3em;text-transform:uppercase;color:#4a5058}
.brandmark b{color:var(--muted);font-style:italic}
</style>
</head>
<body>

<div id="strobe"></div>
<div id="dots"></div>

<div id="center">
  <div class="site-title">COGNITIVO GYM</div>
  <div class="site-sub">Cada Punto Cuenta</div>

  <div class="code-label">Access Code</div>
  <input class="code-input" id="gate-code" maxlength="40" placeholder="• • • •" autocomplete="off" autocapitalize="characters" onkeydown="if(event.key==='Enter')tryEnter()">
  <button class="enter-btn" id="enterBtn" onclick="tryEnter()">Start Training →</button>
  <div class="err" id="gate-err"></div>
  <a class="coach-link" href="coach.html">🧑‍🏫 Coach View</a>

  <div class="brandmark">Powered by <b>Gostar Digital</b></div>
</div>

<script>
var $=function(id){return document.getElementById(id)};

// ══════════════════════════════════════════════════════
//  ACCESS CODE — the same way in as vreaction.com.
//
//  Codes are issued in License Admin → "Hooporia Mobi" tab (product
//  key 'fortress-mobile', kept from the old name so codes already
//  issued keep working). The database's check_access answers yes or
//  no plus the school name, judges expiry on its own clock and counts
//  devices for codes with a device limit.
//
//  The pass lives in sessionStorage ('fortress-mobile-gate-pass'):
//  a sign-in lasts until the browser tab or app is closed, then the
//  code is asked again. Every game page checks that key first. The
//  old open-entry key ('rct-mobile-pass', still set by The Reset,
//  which stays open to everyone) no longer opens the games.
//
//  The code's school goes to 'rct-mobile-school', which The Fortress
//  board already reads, so each school has its own board again.
// ══════════════════════════════════════════════════════
var SUPABASE_URL = 'https://sdaphocueugzfvjovuxd.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkYXBob2N1ZXVnemZ2am92dXhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MjQyMDgsImV4cCI6MjA5OTIwMDIwOH0.pDAzf4P6dD9eNEBlnP95SdF5BI-R84-Rdc0vKzYcn7M';
var PRODUCT = 'fortress-mobile';
function deviceId(){
  var id = null;
  try { id = localStorage.getItem('gostar-device-id'); } catch(e){}
  if (!id){
    id = 'd-' + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
    try { localStorage.setItem('gostar-device-id', id); } catch(e){}
  }
  return id;
}
function rpc(name, body){
  return fetch(SUPABASE_URL + '/rest/v1/rpc/' + name, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
}
var checking = false;
function tryEnter(){
  if (checking) return;
  var input = $('gate-code').value.trim();
  if (!input) return;
  checking = true;
  $('gate-err').style.color = 'var(--muted)';
  $('gate-err').textContent = 'Checking…';
  rpc('check_access', { p_code: input, p_product: PRODUCT, p_device: deviceId() })
  .then(function(r){ if (!r.ok) throw new Error('lookup failed'); return r.json(); })
  .then(function(lic){
    if (!lic || !lic.ok){
      checking = false;
      if (lic && lic.reason === 'devices') return reject('This code is already in use on ' + (lic.max_devices || 5) + ' devices. Ask your administrator to reset it.');
      if (lic && lic.reason === 'expired') return reject('This license has expired');
      if (lic && lic.reason === 'revoked') return reject('This code is no longer active.');
      return reject('Invalid code — check with your administrator');
    }
    try {
      sessionStorage.setItem('fortress-mobile-gate-pass', '1');
      sessionStorage.setItem('fortress-mobile-license', input.toUpperCase());
      localStorage.setItem('rct-mobile-school', lic.school_name || '');
      localStorage.removeItem('rct-mobile-license');
    } catch(e){}
    // The code's age group (License Admin), if it has one. No answer = none, never a block.
    return rpc('license_category', { p_code: input, p_product: PRODUCT })
      .then(function(r){ return r.ok ? r.json() : null })
      .catch(function(){ return null })
      .then(function(cat){
        try { sessionStorage.setItem('fortress-mobile-category', (typeof cat === 'string' ? cat : '') || ''); } catch(e){}
        window.location.href = 'fortress-mobile-hub.html';
      });
  })
  .catch(function(){ checking = false; reject('Connection problem — please try again'); });
}
function reject(msg){
  $('gate-err').style.color = '#ff8888';
  $('gate-err').textContent = msg;
  var box = $('gate-code');
  box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
  box.value = ''; box.focus();
}

// ── 120 beat: visual (strobe + flying gold dots), matching the hub's own ambient effect ──
var BPM = 120, beatMs = 60000/BPM;
function beatTick(){
  var st=$('strobe'); if(st){st.style.opacity='.10'; setTimeout(function(){st.style.opacity='0'},80)}
  spawnDot();
}
function spawnDot(){
  var layer=$('dots'); if(!layer) return;
  var d=document.createElement('div');
  d.className='beat-dot';
  d.style.left=(8+Math.random()*84)+'%';
  d.style.top=(8+Math.random()*74)+'%';
  var dur=Math.round(beatMs*0.95);
  d.style.animation='beatDotFly '+dur+'ms ease-out forwards';
  layer.appendChild(d);
  setTimeout(function(){ if(d&&d.parentNode) d.parentNode.removeChild(d) }, dur+60);
}
setInterval(beatTick, beatMs);
beatTick();
</script>
</body>
</html>
