<!DOCTYPE html>
<html lang="en">
<head>
<script>
if (localStorage.getItem('rct-mobile-pass') !== '1') {
  window.location.replace('index.html');
}
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Warm-Up Complete · Cognitivo Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#FFD700;--orange:#FF6B35;--teal:#00D9A5;--dark:#0a0a0f;--card:#111118;
  --text:#FFFFFF;--muted:#8892a0;--border:rgba(255,255,255,0.1)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;font-family:'Outfit',sans-serif;background:var(--dark);color:var(--text);
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}

#wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:calc(28px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom))}
.kick{font-size:.62rem;font-weight:900;letter-spacing:.4em;text-transform:uppercase;
  color:var(--teal);margin-bottom:10px}
.title{font-family:'Bebas Neue',sans-serif;font-size:2.1rem;letter-spacing:3px;
  background:linear-gradient(135deg,var(--gold),var(--orange));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:26px}

/* One row per station, in the order they were played. The breakdown is
   the point of this screen: a single total says how it went, but the
   rows say WHERE it went — which is the only part a student can act
   on next time. */
.rows{width:100%;max-width:380px;display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);
  border:1px solid var(--border);border-radius:14px;position:relative;overflow:hidden}
.row::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold)}
.row .n{font-family:'Bebas Neue',sans-serif;font-size:.8rem;color:var(--gold);
  letter-spacing:1px;min-width:22px;text-align:left}
.row .nm{flex:1;font-family:'Bebas Neue',sans-serif;font-size:1.15rem;letter-spacing:1.5px;
  text-align:left}
.row .sc{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--text)}
.row.best::before{background:var(--teal)}
.row.best .sc{color:var(--teal)}

.total{width:100%;max-width:380px;padding:18px;border-radius:16px;margin-bottom:26px;
  background:linear-gradient(135deg,rgba(255,215,0,.12),rgba(255,107,53,.08));
  border:1.5px solid rgba(255,215,0,.4)}
.total .lbl{font-size:.6rem;font-weight:900;letter-spacing:.3em;text-transform:uppercase;
  color:var(--muted);margin-bottom:4px}
.total .val{font-family:'Bebas Neue',sans-serif;font-size:3rem;line-height:1;color:var(--gold)}

.again{width:100%;max-width:380px;padding:16px;border:none;border-radius:14px;
  background:linear-gradient(135deg,var(--gold),var(--orange));color:#1a0f0f;
  font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:3px;text-transform:uppercase;
  cursor:pointer;margin-bottom:10px}
.again:active{transform:scale(.98)}
.home{width:100%;max-width:380px;padding:14px;border:1px solid var(--border);border-radius:14px;
  background:transparent;color:var(--muted);font-family:'Outfit',sans-serif;font-size:.82rem;
  font-weight:700;cursor:pointer;text-decoration:none;display:block;text-align:center}
.foot{margin-top:26px;font-size:.58rem;font-weight:900;letter-spacing:.24em;
  text-transform:uppercase;color:#4a5058}
.foot b{color:var(--muted);font-style:italic}
</style>
</head>
<body>

<div id="wrap">
  <div class="kick">Warm-Up Complete</div>
  <div class="title">FOUR MINUTES DONE</div>

  <div class="rows" id="rows"></div>

  <div class="total">
    <div class="lbl">Total</div>
    <div class="val" id="total">0</div>
  </div>

  <button class="again" id="again">▶ Go Again</button>
  <a class="home" href="fortress-mobile-hub.html">← Back to the gym</a>

  <div class="foot">Powered by <b>Gostar Digital</b></div>
</div>

<script>
// ══════════════════════════════════════════════════════
//  WHERE THE WARM-UP ENDS
//
//  Every station wrote its score into the session on its way out, so
//  this page computes nothing and plays nothing — it reads what the
//  run left behind and shows it.
//
//  THE SAME LIST AS THE STATIONS, and it has to stay that way: these
//  names and files are copied from the WARM block the three games
//  share. If a station is added or reordered there, it is reordered
//  here too, or the rows will label the wrong scores.
//
//  THE FOUR SCORE ON ONE SCALE: ten points per cell per round, for
//  every chain you COMPLETE inside your minute. Recall, Recognition
//  and Replay all pay it directly — a four-cell chain is forty points
//  in any of the three. Fortress has five targets rather than
//  twenty-five, so it is scaled by log(5)/log(25) and a round there
//  is worth half what a twenty-five-cell round is worth.
//
//  Completed is the word that matters. A chain you were part way
//  through when the buzzer went, or when you missed, is worth
//  nothing — in all four.
//
//  So the four rows are comparable, and the total is a fair sum
//  rather than whichever game happened to pay more.
// ══════════════════════════════════════════════════════
var LIST = [
  { n:1, name:'RECALL',      file:'002-recall.html'      },
  { n:2, name:'RECOGNITION', file:'003-recognition.html' },
  { n:3, name:'REPLAY',      file:'004-replay.html'      },
  { n:4, name:'FORTRESS',    file:'001-fortress.html'    }
];
var KEY_ON = 'cg-warm-active';
var KEY_SC = 'cg-warm-scores';

function scores(){
  var out = {};
  LIST.forEach(function(s){ out['s'+s.n] = 0 });
  try {
    var raw = sessionStorage.getItem(KEY_SC);
    if (raw){
      var got = JSON.parse(raw);
      LIST.forEach(function(s){ out['s'+s.n] = parseInt(got['s'+s.n], 10) || 0 });
    }
  } catch(e){}
  return out;
}

/* The run is over. Clearing the flag here and not on the way in means
   a reload of this page still shows the same scores, while anything
   else opened afterwards is an ordinary game again. */
try { sessionStorage.removeItem(KEY_ON) } catch(e){}

(function paint(){
  var all = scores(), total = 0, best = -1, bestN = 0;
  LIST.forEach(function(s){
    var v = all['s'+s.n];
    total += v;
    if (v > best){ best = v; bestN = s.n }
  });

  var html = '';
  LIST.forEach(function(s){
    var v = all['s'+s.n];
    /* The best station is marked only when there is something to mark:
       with every score at zero, crowning one of them is noise. */
    var marca = (total > 0 && s.n === bestN) ? ' best' : '';
    html += '<div class="row' + marca + '">' +
              '<span class="n">' + s.n + '</span>' +
              '<span class="nm">' + s.name + '</span>' +
              '<span class="sc">' + v + '</span>' +
            '</div>';
  });
  document.getElementById('rows').innerHTML = html;
  document.getElementById('total').textContent = total;
})();

/* Going again starts a clean run from the first station, carrying the
   shortened station length if this one was a test run. */
document.getElementById('again').onclick = function(){
  var q = '';
  try {
    var s = parseInt(new URLSearchParams(location.search).get('seg'), 10);
    if (s > 0 && s <= 600) q = '?seg=' + s;
  } catch(e){}
  try {
    sessionStorage.setItem(KEY_ON, '1');
    sessionStorage.removeItem(KEY_SC);
  } catch(e){}
  location.href = LIST[0].file + q;
};
</script>
</body>
</html>
