name: Ritnome flagship integration
on:
  push:
    branches: [feature/ritnome-integration]
  pull_request:
    paths:
      - 'ritnome/**'
      - 'fortress-mobile-hub.html'
      - 'tests/ritnome-integration.test.cjs'
      - '.github/workflows/ritnome-integration.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/ritnome-browser" --no-save --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/ritnome-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify installed Ritnome and flagship hub
        run: NODE_PATH="$RUNNER_TEMP/ritnome-browser/node_modules" node tests/ritnome-integration.test.cjs fortress-mobile-hub.html
