name: Ritnome browser validation
on:
  pull_request:
    paths:
      - 'development/ritnome-*'
      - '.github/workflows/ritnome-browser.yml'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/ritnome-browser" --no-save --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/ritnome-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Validate actual browser audio and mobile controls
        run: NODE_PATH="$RUNNER_TEMP/ritnome-browser/node_modules" node development/ritnome-browser.test.cjs
