name: Coach Memory end to end
on:
  push:
    branches: [main, coach-memory-release]
    paths: ['coach.html', 'coach-memory.js', 'coach-memory/**', '.github/workflows/coach-memory-e2e.yml']
  pull_request:
    paths: ['coach.html', 'coach-memory.js', 'coach-memory/**']
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic_test_only
          POSTGRES_DB: coach_memory_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d coach_memory_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic_test_only
      PGDATABASE: coach_memory_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hooporiapr-oss/hooporia-server
          ref: feature/coach-memory-backend
          path: .hooporia-server
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Built file matches its sources
        run: node coach-memory/build.cjs && git diff --exit-code -- coach-memory.js
      - name: Apply the release SQL to a disposable database
        run: |
          psql -X -v ON_ERROR_STOP=1 -f .hooporia-server/coach-memory/staging/sql-test-bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -f coach-memory/release.sql
          psql -X -v ON_ERROR_STOP=1 -c "create role cm_test_login login noinherit password 'synthetic_test_only'; grant coach_memory_backend to cm_test_login;"
      - run: cd .hooporia-server && npm ci
      - run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Browser end to end against the real server handler
        env:
          COACH_MEMORY_SERVER_DIR: ${{ github.workspace }}/.hooporia-server
          COACH_MEMORY_TEST_DATABASE_URL: postgres://cm_test_login:synthetic_test_only@localhost:5432/coach_memory_test
          COACH_MEMORY_TEST_ADMIN_URL: postgres://postgres:synthetic_test_only@localhost:5432/coach_memory_test
        run: node coach-memory/e2e.test.cjs
