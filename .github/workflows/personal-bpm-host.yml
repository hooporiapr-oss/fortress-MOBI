name: Personal BPM host validation
on:
  pull_request:
    paths:
      - 'development/personal-bpm-host*.cjs'
      - '.github/workflows/personal-bpm-host.yml'
  push:
    branches: [feature/coach-memory-developmental-stage]
    paths:
      - 'development/personal-bpm-host*.cjs'
      - '.github/workflows/personal-bpm-host.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test development/personal-bpm-host.test.cjs
