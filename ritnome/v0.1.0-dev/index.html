<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ritnome · 0.1.0-dev</title><style>
*{box-sizing:border-box}body{margin:0;background:#101c2a;color:#fff;font:16px system-ui,sans-serif}main{max-width:480px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center}h1{text-align:center;letter-spacing:.14em;margin-bottom:0}p{text-align:center;color:#b9c8d8}button,input,select{font:inherit;color:inherit;background:#203345;border:1px solid #718196;border-radius:10px;padding:12px}button{cursor:pointer}button:disabled{opacity:.55}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid white;outline-offset:2px}label{display:block;margin:12px 0 6px}select,input{width:100%}.tempo{text-align:center;font-size:56px;font-weight:800;color:#ff9b43}.drums{display:flex;gap:14px;justify-content:center;margin:20px 0}.drum{flex:1;text-align:center}.skin{height:100px;border-radius:40% 40% 25% 25%;background:linear-gradient(#f3d9a6 0 14%,#b76c39 15% 100%);border:3px solid #dba657;margin-bottom:6px}.beats{display:flex;justify-content:center;gap:12px;margin:20px}.beat{width:14px;height:14px;border-radius:50%;background:#607287}.beat.on{background:#ff9b43}.actions{display:flex;gap:8px;margin-top:16px}.actions button{flex:1}.primary{background:#ff7a18;color:#101c2a;font-weight:800}.note{font-size:12px;line-height:1.5}.count{text-align:center;font-size:24px;font-variant-numeric:tabular-nums}
</style></head><body><main><header><strong>RITNOME</strong><button id="language" type="button">EN</button></header><h1>RITNOME</h1><p id="subtitle"></p><div id="tempo" class="tempo">90 BPM</div><div class="drums"><div class="drum"><div class="skin"></div>Tumba</div><div class="drum"><div class="skin"></div>Conga</div><div class="drum"><div class="skin"></div>Quinto</div></div><div class="beats" aria-hidden="true"><span class="beat"></span><span class="beat"></span><span class="beat"></span><span class="beat"></span></div><label for="mode" id="modeLabel"></label><select id="mode"><option value="manual" id="manual"></option><option value="tap" id="tapMode"></option><option value="personal" id="personal" disabled></option></select><label for="bpm" id="bpmLabel"></label><input id="bpm" type="number" min="40" max="200" step="1" value="90"><button type="button" id="tap" hidden></button><label for="duration" id="durationLabel"></label><select id="duration"><option value="30">30 s</option><option value="60" selected>60 s</option><option value="120">120 s</option><option value="free" id="free"></option></select><div class="count" id="remaining">—</div><p id="status" role="status" aria-live="polite"></p><div class="actions"><button id="start" class="primary" type="button"></button><button id="stop" type="button" disabled></button></div><p class="note" id="note"></p></main><script src="./ritnome-audio.js"></script><script src="./ritnome-clock.js"></script><script src="./authenticated-ritnome.js"></script><script src="./ritnome-warmup.js"></script></body></html>
